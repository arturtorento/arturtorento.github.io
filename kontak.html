  <main>
    <section>
      <p class="eyebrow">KONTAK</p>
      <h1>Hubungi Saya</h1>
      <p>Email: faturrmdhn11@gmail.com | Telepon: 085900093075</p>
      <form action="#" method="post">
        <label for="nama">Nama Lengkap</label>
        <input type="text" id="nama" name="nama" required minlength="3">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
        <label for="telp">Nomor Telepon</label>
        <input type="tel" id="telp" name="telp" pattern="[0-9]{10,13}" title="Masukkan 10-13 digit angka">
        <label for="subjek">Subjek</label>
        <select id="subjek" name="subjek" required>
          <option value="">-- Pilih subjek --</option>
          <option>Kerja sama</option><option>Pertanyaan</option><option>Lainnya</option>
        </select>
        <label for="pesan">Pesan</label>
        <textarea id="pesan" name="pesan" rows="5" required></textarea>
        <label class="checkbox-label"><input type="checkbox" name="setuju" required> Saya menyetujui data saya digunakan untuk membalas pesan ini.</label>
        <button type="submit" class="tombol">Kirim Pesan</button>
      </form>
    </section>
  </main>
